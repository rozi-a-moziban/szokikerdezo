<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEEFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Szókikérdező program</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/poppins-medium.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>
/* a téma beállítása rajzolás előtt, hogy ne villanjon */
try {
  var s = JSON.parse(localStorage.getItem('szk:v1') || '{}').settings || {};
  if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
  if (s.fontScale) document.documentElement.style.fontSize = (16 * s.fontScale) + 'px';
} catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<input type="file" id="file" accept=".txt,.docx,.xlsx,.json" hidden>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/unzip.js"></script>
<script src="js/importers.js"></script>
<script src="js/spell.js"></script>
<script src="js/speech.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
